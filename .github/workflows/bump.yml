name: bump formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bump (source-built formulae only)"
        required: true
        type: choice
        options:
          - wss-mux
          - wavefront
      tag:
        description: "New upstream release tag, e.g. v0.6.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass workflow inputs through env, never interpolated into the script
          # body, so a hostile value cannot break out of the shell.
          FORMULA: ${{ inputs.formula }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # TAG is free-text input: constrain it to a version string before it
          # reaches git/sed. This rejects every shell metacharacter.
          if [[ ! "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' is not a valid version (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          file="Formula/${FORMULA}.rb"
          repo="https://github.com/alternet-dev/${FORMULA}.git"

          # Resolve the tag to its immutable commit SHA. Annotated tags expose
          # the commit through the peeled ^{} ref; a lightweight tag already is
          # the commit.
          revision="$(git ls-remote "${repo}" "refs/tags/${TAG}^{}" | cut -f1)"
          if [ -z "${revision}" ]; then
            revision="$(git ls-remote "${repo}" "refs/tags/${TAG}" | cut -f1)"
          fi
          if [ -z "${revision}" ]; then
            echo "::error::tag '${TAG}' not found in ${repo}"
            exit 1
          fi
          echo "Resolved ${TAG} -> ${revision}"

          branch="bump/${FORMULA}-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"

          sed -i -E "s#^      tag:[[:space:]]+\".*\"#      tag:      \"${TAG}\"#" "${file}"
          sed -i -E "s#^      revision:[[:space:]]+\".*\"#      revision: \"${revision}\"#" "${file}"

          git add "${file}"
          git commit -m "${FORMULA} ${TAG}"
          git push -u origin "${branch}"

          gh pr create \
            --base trunk \
            --head "${branch}" \
            --title "${FORMULA} ${TAG}" \
            --body "Automated bump of ${FORMULA} to ${TAG} (commit ${revision})."
